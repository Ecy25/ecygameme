name: Build Kralligin Yukselisi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java version
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f icon.svg ]; then cp icon.svg www/; fi
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Configure Capacitor
        run: |
          node -e "
          const fs = require('fs');
          const p = require('./capacitor.config.json');
          p.webDir = 'www';
          p.appId = 'com.kralligin.yukselisi';
          p.appName = 'Kralligin Yukselisi';
          fs.writeFileSync('capacitor.config.json', JSON.stringify(p, null, 2));
          "

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kralligin-yukselisi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
